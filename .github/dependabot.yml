version: 2

# Keeping the tooling current is what actually clears dependency advisories
# here. The findings a plain `npm audit` reports live inside the npm CLI's
# *bundled* dependencies, which `overrides` cannot rewrite and no local change
# can fix — they clear when upstream npm ships a release that bundles patched
# copies. Something has to notice that release; this does, instead of a person
# re-running `npm audit` and wondering whether anything moved.
#
# Everything lands in ONE pull request a week: npm runtime deps, npm tooling
# and GitHub Actions together. Per-group (or per-package) PRs piled up faster
# than they were merged and kept conflicting on package-lock.json; one batch is
# reviewed, CI'd and merged once. The multi-ecosystem group is what lets npm
# and github-actions share that single PR.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly
    patterns: ['*']
    # Advisory-driven fixes (mostly transitive packages such as undici or
    # follow-redirects) are not version updates, so the weekly group never
    # carries them. GitHub opens these as soon as an advisory lands rather than
    # on the schedule; this at least batches whatever is open into one PR
    # instead of one PR per package.
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    # typescript-eslint's parser pins a `typescript` peer range that trails the
    # compiler's own releases (8.72.1 still caps at `<6.1.0`). A grouped major
    # bump therefore lands a TypeScript the linter cannot accept, and `npm ci`
    # fails on ERESOLVE before a single check runs — which is exactly how
    # typescript@7 got in. Majors here need a human to confirm the parser has
    # caught up first; minors and patches stay automatic.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ['*']
