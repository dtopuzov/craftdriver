name: Chrome compatibility (hybrid launch)

# The vendored chromium-bidi mapper talks CDP, Chrome's own protocol, so its
# compatibility is per Chrome version. Run the hybrid-launch gates against the
# oldest supported major (manifest chromeSupport.minMajor) and the current
# Stable, Beta and Dev builds from Chrome for Testing. A red Dev/Beta cell is
# an early warning to run the mapper-update skill before that Chrome ships.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/bidi/**'
      - 'src/lib/chromeLauncher.ts'
      - 'src/lib/hybridLaunch.ts'
      - '.github/workflows/chrome-compat.yml'

permissions:
  contents: read

jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        target: [min, Stable, Beta, Dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome for Testing (${{ matrix.target }})
        run: |
          base=https://googlechromelabs.github.io/chrome-for-testing
          if [ "${{ matrix.target }}" = min ]; then
            major=$(jq -r .chromeSupport.minMajor src/lib/bidi/vendor/chromium-bidi-mapper.manifest.json)
            version=$(curl -sf "$base/latest-versions-per-milestone.json" | jq -r ".milestones[\"$major\"].version")
          else
            version=$(curl -sf "$base/last-known-good-versions.json" | jq -r ".channels.${{ matrix.target }}.version")
          fi
          echo "Chrome $version"
          curl -sfL -o chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          unzip -q chrome.zip -d "$RUNNER_TEMP"
          echo "CRAFTDRIVER_CHROME_PATH=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Start test server
        run: npm run serve &

      - name: Wait for server
        run: timeout 2m bash -c "until curl -I http://127.0.0.1:8080/login.html; do sleep 1; done"

      - name: Hybrid launch gates
        run: >
          npx vitest run tests/mapper-bundle.test.ts tests/hybrid-launch.test.ts
          tests/chrome-smoke.test.ts tests/dialogs.test.ts tests/evaluate.test.ts
          tests/network.test.ts
        env:
          HEADLESS: true
          CRAFTDRIVER_CHROME_LAUNCH_MODE: hybrid
          # The runner's preinstalled chromedriver matches its own Chrome, not
          # the one under test: skip it so craftdriver downloads a matching one.
          CHROMEWEBDRIVER: ''
          CRAFTDRIVER_SKIP_PATH_PROBE: '1'
