name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Check docs
        run: npm run docs:check

      - name: Start test server
        run: npm run serve &

      - name: Wait for server
        run: timeout 2m bash -c "until curl -I http://127.0.0.1:8080/login.html; do sleep 1; done"

      - name: Run tests (Chrome)
        run: npm test
        env:
          HEADLESS: true

      - name: Run recipe snippets (Chrome)
        run: npm run test:recipes
        env:
          HEADLESS: true

      - name: Run tests (Firefox)
        run: npm run test:firefox
        env:
          HEADLESS: true

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Start test server
        shell: bash
        run: npm run serve &

      # Portable retry loop — macOS runners lack GNU `timeout`.
      - name: Wait for server
        shell: bash
        run: |
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/login.html && exit 0
            sleep 1
          done
          echo "Server did not start in time" >&2
          exit 1

      # shell: bash on every step — Actions defaults to PowerShell on Windows, where `&` differs.
      - name: Chrome smoke test
        shell: bash
        run: npx vitest run tests/chrome-smoke.test.ts
        env:
          HEADLESS: true

      - name: Firefox smoke test
        shell: bash
        run: npx vitest run tests/firefox-smoke.test.ts
        env:
          HEADLESS: true
          BROWSER_NAME: firefox

  safari:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Enable Safari automation
        run: sudo safaridriver --enable

      - name: Start test server
        run: npm run serve &

      - name: Wait for server
        run: |
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/login.html && exit 0
            sleep 1
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Run tests (Safari)
        run: npm run test:safari

  electron-e2e:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # chrome-sandbox loses its root SUID bit when unzipped → disable the sandbox.
            electron_args: '--no-sandbox'
          - os: windows-latest
            electron_args: ''
    runs-on: ${{ matrix.os }}
    env:
      # Maps to Chromium 150 + a matching CfT driver. Bump with the example app's
      # Electron version (the downloaded release is pinned in tests/electron/fixture.ts).
      CRAFTDRIVER_ELECTRON_VERSION: 43.1.0
      CRAFTDRIVER_ARTIFACTS_DIR: ${{ github.workspace }}/electron-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron is a GUI app: Linux runs under xvfb, Windows has a real display.
      - name: Run Electron e2e tests
        shell: bash
        env:
          CRAFTDRIVER_ELECTRON_ARGS: ${{ matrix.electron_args }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run test:electron
          else
            npm run test:electron
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ matrix.os }}
          path: electron-artifacts/
          if-no-files-found: ignore
